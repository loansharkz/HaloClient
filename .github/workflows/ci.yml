name: CI
on:
  push:
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck + build
        run: pnpm build

  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Tauri system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libdbus-1-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Frontend dist placeholder
        run: mkdir -p dist && echo '<!doctype html>' > dist/index.html
      - name: Tests (includes a real JVM launch test)
        working-directory: src-tauri
        run: cargo test
      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

  # Compiles the Windows-only code (Instant Play window/audio/priority control).
  backend-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Frontend dist placeholder
        shell: bash
        run: mkdir -p dist && echo '<!doctype html>' > dist/index.html
      - name: Clippy (Windows)
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

  halo-hud:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: mods/halo-hud
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: 25
      - run: chmod +x gradlew && ./gradlew build
      - uses: actions/upload-artifact@v4
        with:
          name: halo-hud
          path: |
            mods/halo-hud/build/libs/halo-hud-*.jar
            mods/halo-hud/build/libs/halo-hud.json
