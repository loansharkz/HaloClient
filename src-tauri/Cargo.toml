[package]
name = "halo-client"
version = "0.1.5"
description = "Halo Client - a fast Minecraft: Java Edition launcher"
authors = ["Leo"]
edition = "2021"
rust-version = "1.80"

[lib]
name = "halo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "multipart", "gzip"] }
futures = "0.3"
sha1 = "0.10"
sha2 = "0.10"
md-5 = "0.10"
hex = "0.4"
anyhow = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
flate2 = "1"
tar = "0.4"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
keyring = { version = "3", features = ["windows-native", "apple-native", "linux-native"] }
discord-rich-presence = "0.2"
regex = "1"
base64 = "0.22"
walkdir = "2"
fastnbt = "2"
hickory-resolver = { version = "0.24", default-features = false, features = ["tokio-runtime", "system-config"] }
sentry = { version = "0.34", default-features = false, features = ["backtrace", "contexts", "panic", "reqwest", "rustls"] }
log = { version = "0.4", features = ["std"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_Media_Audio",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
